name: Documentation Quality

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '**/*.yaml'
      - '**/*.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - '**/*.yaml'
      - '**/*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doc-quality:
    name: Documentation Quality Checks
    runs-on: ubuntu-latest
    # The checks themselves take about 2 seconds locally across 445 markdown files.
    # 5 minutes was still exceeded once (6m26s) on a slow runner, cancelling a job
    # whose every step had passed. Raised for headroom against runner variance, not
    # because the work grew expensive.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check Markdown table/fence rendering
        run: |
          echo "🔍 Checking Markdown tables and code fences for rendering breakage..."
          git ls-files -- '*.md' | xargs python3 scripts/check-markdown-tables.py

      - name: Check for real AWS Account IDs in tracked files
        run: |
          echo "🔍 Scanning for real AWS Account IDs..."
          python3 scripts/check-account-ids.py

      - name: Check EN/JA pair completeness
        run: |
          echo "🔍 Checking EN/JA document pairs..."
          MISSING=0
          # Check demo scenarios
          for f in integrations/iceberg-metadata-catalog/demo/scenarios/industry-*.md; do
            if [[ "$f" == *"-ja.md" ]]; then continue; fi
            JA="${f%.md}-ja.md"
            if [[ ! -f "$JA" ]]; then
              echo "::warning::Missing JA pair: $JA"
              MISSING=$((MISSING+1))
            fi
          done
          # Check adoption guide
          for f in docs/adoption-guide/*.md; do
            if [[ "$f" == *"-ja.md" ]]; then continue; fi
            BASE=$(basename "$f" .md)
            JA="docs/adoption-guide/${BASE}-ja.md"
            if [[ ! -f "$JA" ]] && [[ "$BASE" != "README" ]]; then
              echo "::warning::Missing JA pair: $JA"
              MISSING=$((MISSING+1))
            fi
          done
          if [[ $MISSING -gt 0 ]]; then
            echo "::warning::$MISSING documents missing JA translations"
          fi
          echo "✓ EN/JA pair check complete ($MISSING missing)"

      - name: Check for broken internal links
        run: |
          echo "🔍 Checking internal markdown links..."
          BROKEN=0
          git ls-files -- '*.md' | while read -r mdfile; do
            dir=$(dirname "$mdfile")
            grep -oP '\[.*?\]\(\K[^)]+' "$mdfile" 2>/dev/null | \
              grep -v '^http' | grep -v '^#' | grep -v '^mailto' | \
              while read -r link; do
                # Remove anchors
                target="${link%%#*}"
                if [[ -z "$target" ]]; then continue; fi
                resolved="$dir/$target"
                if [[ ! -e "$resolved" ]] && [[ ! -e "$target" ]]; then
                  echo "::warning file=$mdfile::Broken link: $link"
                  BROKEN=$((BROKEN+1))
                fi
              done
          done || true
          echo "✓ Link check complete (warn-only, and filesystem-based:"
          echo "   see 'Check documentation references are tracked in git' for the"
          echo "   check that fails the build and asks git rather than the disk)"

      - name: Check documentation references are tracked in git
        run: |
          echo "🔍 Checking that referenced files are in the repository..."
          # The link check above tests the filesystem, so a file that exists
          # locally but is gitignored passes it. That is how a runbook came to
          # point at two files nobody else could see. This step asks git, and
          # unlike the check above it is allowed to fail the build.
          python3 shared/scripts/check_doc_references_tracked.py

      - name: Validate YAML syntax
        run: |
          echo "🔍 Validating YAML files..."
          pip install -q pyyaml
          ERRORS=0
          git ls-files -- '*.yaml' '*.yml' | while read -r yamlfile; do
            python3 -c "import yaml; yaml.safe_load(open('$yamlfile'))" 2>&1 || {
              echo "::error file=$yamlfile::Invalid YAML syntax"
              ERRORS=$((ERRORS+1))
            }
          done
          echo "✓ YAML validation complete"

      - name: Check for support case numbers in tracked files
        run: |
          echo "🔍 Scanning for support case numbers..."
          # Detect support case numbers by format and by keyword context, rather than a
          # hardcoded list (which would itself embed sensitive numbers in this file).
          #   - AWS-style 15-digit case IDs (e.g. 177.../178...)
          #   - "support case" / "case id|no|number|#" / "サポートケース" adjacent to 6+ digits
          #     (covers Snowflake/Databricks 8-digit IDs, case_id fields, support-case-* paths)
          GLOBS=(--  '*.md' '*.yaml' '*.yml' '*.py' '*.sql' '*.json')
          AWS_HITS=$(git ls-files "${GLOBS[@]}" | xargs grep -nE '\b17[0-9]{13}\b' 2>/dev/null | grep -v '\.github/workflows/' || true)
          KW_HITS=$(git ls-files "${GLOBS[@]}" | xargs grep -niE '(support[ _-]?case|case[ _-]?(id|no|number|#)|サポートケース)[^0-9]{0,30}[0-9]{6,}' 2>/dev/null | grep -v '\.github/workflows/' || true)
          HITS=$(printf '%s\n%s\n' "$AWS_HITS" "$KW_HITS" | grep -vE '^[[:space:]]*$' | sort -u || true)
          if [[ -n "$HITS" ]]; then
            echo "::error::Possible support case numbers found in tracked files. Reference support engagements by topic only — no case numbers or engineer names."
            echo "$HITS"
            exit 1
          fi
          echo "✓ No support case numbers in tracked files"

      - name: Check for engineer/personal names in support records
        run: |
          echo "🔍 Scanning for engineer/personal names in support-record fields..."
          # Best-effort, low-false-positive heuristic: only flag person-denoting fields
          # (responder / support_engineer / case_owner / escalation_contact) whose VALUE
          # is a person-name shape (Firstname + initial(s) or Firstname Lastname).
          # Case-sensitive on purpose so acronyms like "AWS Support" do NOT match.
          # General free-text name detection is intentionally NOT attempted (the docs use
          # "Phase A/B", "Pattern A", "Method C" etc., which would cause false positives);
          # broader name screening remains a manual confidentiality-review responsibility.
          HITS=$(git ls-files -- '*.md' '*.yaml' '*.yml' '*.json' | \
            xargs grep -nE "(responder|support_engineer|case_owner|escalation_contact)[\"' ]*[:：] *[\"'][A-Z][a-z]{2,}( [A-Z]\.| [A-Z] [A-Z]| [A-Z][a-z]+)[\"']" 2>/dev/null | \
            grep -v '\.github/workflows/' || true)
          if [[ -n "$HITS" ]]; then
            echo "::error::Possible engineer/personal name found in a support-record field. Use a generic value (e.g. \"AWS Support\")."  # <!-- allow:support-attribution -->
            echo "$HITS"
            exit 1
          fi
          echo "✓ No engineer/personal names in support-record fields"

      - name: Check JA/EN section count parity
        run: |
          echo "🔍 Checking JA/EN section count parity (docs/ja vs docs/en)..."
          MISMATCHES=0
          for ja_file in docs/ja/*.md; do
            basename=$(basename "$ja_file")
            en_file="docs/en/$basename"
            if [[ ! -f "$en_file" ]]; then
              echo "::warning file=$ja_file::No EN pair found: $en_file"
              continue
            fi
            JA_SECTIONS=$(grep -c '^##' "$ja_file" 2>/dev/null || echo 0)
            EN_SECTIONS=$(grep -c '^##' "$en_file" 2>/dev/null || echo 0)
            if [[ "$JA_SECTIONS" -ne "$EN_SECTIONS" ]]; then
              echo "::warning file=$ja_file::Section count mismatch: JA=$JA_SECTIONS EN=$EN_SECTIONS ($basename)"
              MISMATCHES=$((MISMATCHES+1))
            fi
          done
          if [[ $MISMATCHES -gt 0 ]]; then
            echo "::warning::$MISMATCHES documents have JA/EN section count mismatches"
          else
            echo "✓ All docs/ja + docs/en pairs have matching section counts"
          fi

      - name: Check document freshness (warn if >90 days stale)
        run: |
          echo "🔍 Checking document freshness (>90 days = stale warning)..."
          STALE=0
          THRESHOLD=$(date -d "90 days ago" +%s 2>/dev/null || date -v-90d +%s 2>/dev/null || echo 0)
          if [[ "$THRESHOLD" -eq 0 ]]; then
            echo "::warning::Cannot determine date threshold on this platform, skipping freshness check"
            exit 0
          fi
          for mdfile in docs/ja/*.md docs/en/*.md; do
            if [[ ! -f "$mdfile" ]]; then continue; fi
            LAST_MODIFIED=$(git log -1 --format="%ct" -- "$mdfile" 2>/dev/null || echo 0)
            if [[ "$LAST_MODIFIED" -lt "$THRESHOLD" ]] && [[ "$LAST_MODIFIED" -gt 0 ]]; then
              DAYS_AGO=$(( ($(date +%s) - LAST_MODIFIED) / 86400 ))
              echo "::warning file=$mdfile::Stale document: last modified $DAYS_AGO days ago (threshold: 90 days)"
              STALE=$((STALE+1))
            fi
          done
          if [[ $STALE -gt 0 ]]; then
            echo "::warning::$STALE documents are stale (>90 days since last update)"
          else
            echo "✓ All documents updated within 90 days"
          fi

      - name: Check verification status table in technical docs
        run: |
          echo "🔍 Checking for verification status tables in technical reference docs..."
          # Technical reference docs that should have a verification status section
          EXPECTED_DOCS=(
            "docs/ja/datasync-to-s3-guide.md"
            "docs/ja/s3-annotations-governance-evaluation.md"
            "docs/ja/compatibility-matrix.md"
            "docs/ja/fsxn-to-databricks-unity-catalog-guide.md"
            "docs/ja/kafka-clickhouse-unity-catalog-connectivity.md"
          )
          MISSING=0
          for doc in "${EXPECTED_DOCS[@]}"; do
            if [[ ! -f "$doc" ]]; then continue; fi
            if ! grep -qE '検証ステータス|Verification Status|検証レベル' "$doc"; then
              echo "::warning file=$doc::Missing verification status section"
              MISSING=$((MISSING+1))
            fi
          done
          if [[ $MISSING -gt 0 ]]; then
            echo "::warning::$MISSING technical docs missing verification status section"
          else
            echo "✓ All technical reference docs have verification status sections"
          fi

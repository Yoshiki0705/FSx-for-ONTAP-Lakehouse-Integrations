name: AI Style

# Writing-style gate. The detector is vendored byte-for-byte from the Hub
# (scripts/ai_style_rules.py). This workflow proves the detector can fail (selftest),
# runs the vendored tests, and then GATES the merge with --fail: a fail-tier finding
# (D1, D2, D5, D14) makes the run exit 1. All other rules stay warning-only (reported
# in the summary, never gating).

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'scripts/ai_style_rules.py'
      - 'scripts/tests/**'
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - 'scripts/ai_style_rules.py'
      - 'scripts/tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-style:
    name: AI Style Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Prove the detector can tell a broken detector from a working one
        run: |
          # A passing selftest is the only evidence that the vendored rules can both
          # fire and stay silent. Run it before trusting any report below.
          python3 scripts/ai_style_rules.py --selftest

      - name: Run the vendored detector tests
        run: |
          python3 scripts/tests/test_ai_style_rules.py
          python3 scripts/tests/test_ai_style_strong_fixtures.py

      - name: Report writing-style findings (summary, non-gating)
        run: |
          # The summary counts every finding, including warning-tier rules that never
          # gate. It runs before the gate so the full picture is in the log on a failure.
          python3 scripts/ai_style_rules.py docs/ja docs/en README-ja.md README.md --summary

      - name: Gate on fail-tier findings (--fail)
        run: |
          # Gating step: --fail exits 1 on a fail-tier finding (D1, D2, D5, D14). The
          # corpus is clean of those, so this passes today and bites the moment one is
          # introduced. Warning-tier rules are reported above but do not fail the build.
          python3 scripts/ai_style_rules.py docs/ja docs/en README-ja.md README.md --fail

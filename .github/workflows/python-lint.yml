name: Python Lint & Syntax

on:
  push:
    branches: [main]
    paths:
      - '**/*.py'
  pull_request:
    branches: [main]
    paths:
      - '**/*.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-check:
    name: Python Syntax & Import Check
    runs-on: ubuntu-latest
    # Raised from 5 to match the other workflows. Slow runners on this branch pushed
    # several jobs past a 5-minute limit while every step passed.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Check Python syntax (compile)
        run: |
          echo "🔍 Checking Python syntax..."
          ERRORS=0
          git ls-files -- '*.py' | while read -r pyfile; do
            python3 -m py_compile "$pyfile" 2>&1 || {
              echo "::error file=$pyfile::Python syntax error"
              ERRORS=$((ERRORS+1))
            }
          done
          echo "✓ Python syntax check complete"

      - name: Check for hardcoded credentials in Python
        run: |
          echo "🔍 Scanning Python files for hardcoded credentials..."
          # Exclusions:
          #   os.environ / getenv  — value sourced from environment, not hardcoded
          #   placeholder / example / <...>  — documented placeholders
          #   {...}  — f-string interpolation of a runtime variable (e.g.
          #            f"SET s3_session_token = '{creds.token}'"), not a literal secret
          HITS=$(git ls-files -- '*.py' | \
            xargs grep -Pn '(?:password|secret|token|api_key)\s*=\s*["\x27][^"\x27]{8,}' 2>/dev/null | \
            grep -v 'os\.environ\|getenv\|placeholder\|example\|<.*>\|{.*}' || true)
          if [[ -n "$HITS" ]]; then
            echo "::error::Potential hardcoded credentials in Python files"
            echo "$HITS"
            exit 1
          fi
          echo "✓ No hardcoded credentials in Python"

      - name: Validate shell scripts (syntax)
        run: |
          echo "🔍 Checking shell script syntax..."
          git ls-files -- '*.sh' | while read -r shfile; do
            bash -n "$shfile" 2>&1 || {
              echo "::error file=$shfile::Shell syntax error"
            }
          done
          echo "✓ Shell syntax check complete"

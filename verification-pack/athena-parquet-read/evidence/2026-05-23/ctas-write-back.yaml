# Verification Evidence Record — Athena CTAS Write-back
test_id: "ATHENA-CTAS-WRITEBACK-001"
date_tested: "2026-05-23"
tester: "repository maintainer"

# Test Description
description: |
  Athena CTAS (Create Table As Select) writes aggregated query results
  back to FSx for ONTAP via S3 Access Point in Parquet format.
  This verifies the full read-transform-write cycle through Athena.

# Infrastructure
region: "ap-northeast-1"
ap_name: "verification-test-ap"
ap_network_origin: "INTERNET"

# Query
query: |
  CREATE TABLE fsxn_athena_verification.gold_status_summary
  WITH (format = 'PARQUET', external_location = 's3://<AP_ALIAS>/gold/athena_status_summary/')
  AS SELECT status, COUNT(*), AVG(temperature), AVG(humidity), AVG(pressure), MIN(temperature), MAX(temperature)
  FROM sensor_readings GROUP BY status

# Results
result: "PASS"
engine_execution_time_ms: 3688
data_scanned_bytes: 95299
output_rows: 3
output_format: "Parquet"
output_location: "s3://verification-tes-fpg5t76dgh3xchkrudk6yc4jhgzz1apn1b-ext-s3alias/gold/athena_status_summary/"
output_file_size_bytes: 1376

# Verification
read_back_verified: true
read_back_query: "SELECT * FROM gold_status_summary ORDER BY total_readings DESC"
read_back_result: |
  normal:   8505 readings, avg_temp=25.02, avg_hum=59.85
  warning:  1221 readings, avg_temp=24.73, avg_hum=60.99
  critical:  274 readings, avg_temp=24.84, avg_hum=60.24

# Known Limitations
known_limitations:
  - "CTAS output location must be empty (Athena will not overwrite)"
  - "Table is registered in Glue Catalog pointing to FSx for ONTAP S3 AP path"
  - "Subsequent CTAS to same location requires DROP TABLE first"

# Glue ETL Note
glue_etl_note: |
  Glue ETL Silver→Gold was attempted but failed due to TIMESTAMP(NANOS,false)
  in Parquet files generated by pandas/DuckDB. This is a Spark 3.3 limitation
  (Glue 4.0), not an FSx for ONTAP S3 AP limitation. Workaround: generate Parquet with
  microsecond timestamps, or use Athena CTAS (which handles nanoseconds correctly).

# Verification Evidence Record — Athena + Iceberg on FSx for ONTAP S3 Access Point
test_id: "ATHENA-ICEBERG-S3AP-001"
date_tested: "2026-08-06"
tester: "repository maintainer"

purpose: |
  The compatibility matrix recorded Athena + Iceberg on an FSx for ONTAP S3
  Access Point as planned, with the read path expected to work and the write
  path untested. This run exercises the full table lifecycle to replace that
  expectation with a measurement.

environment:
  region: "ap-northeast-1"
  aws_account: "<ACCOUNT_ID>"
  fsx_deployment_type: "SINGLE_AZ_1"
  fsx_throughput_capacity_mbps: 128
  s3_access_point: "verification-test-ap"
  s3_ap_network_origin: "INTERNET"
  s3_ap_file_system_user: "root (UNIX)"
  glue_database: "fsxn_iceberg_test"
  glue_table: "athena_iceberg_probe"
  athena_engine: "Athena SQL (engine v3)"

table_placement:
  glue_table_type: "ICEBERG"
  location: "s3://verification-tes-fpg5t76dgh3xchkrudk6yc4jhgzz1apn1b-ext-s3alias/athena-iceberg-probe"
  metadata_location: "s3://verification-tes-fpg5t76dgh3xchkrudk6yc4jhgzz1apn1b-ext-s3alias/athena-iceberg-probe/metadata/00002-c4b3944b-23b5-49a6-96f6-b8c9937006ee.metadata.json"
  both_on_access_point: true
  objects_written_to_access_point: 11
  data_files: 3
  metadata_files: 8

results:
  - operation: "CREATE TABLE (Iceberg) on S3 AP"
    status: "SUCCEEDED"
    duration_ms: 1607
  - operation: "INSERT INTO (Iceberg write / commit)"
    status: "SUCCEEDED"
    duration_ms: 4766
  - operation: "SELECT count(*) (Iceberg read)"
    status: "SUCCEEDED"
    duration_ms: 1606
    returned: "['3']"
  - operation: "SELECT * (Iceberg read)"
    status: "SUCCEEDED"
    duration_ms: 3215
    returned: "['1', '21.5', '2026-08-06 10:00:00.000000']"
  - operation: "Iceberg metadata table ($snapshots)"
    status: "SUCCEEDED"
    duration_ms: 3218
    returned: "['1']"
  - operation: "UPDATE (Iceberg row-level, needs conditional write)"
    status: "SUCCEEDED"
    duration_ms: 4733
  - operation: "SELECT after UPDATE"
    status: "SUCCEEDED"
    duration_ms: 3205
    returned: "['99.9']"
  - operation: "DELETE (row-level)"
    status: "SUCCEEDED"
    duration_ms: 6323
  - operation: "count after DELETE"
    status: "SUCCEEDED"
    duration_ms: 1635
    returned: "['2']"
  - operation: "snapshot count (history accrues)"
    status: "SUCCEEDED"
    duration_ms: 1647
    returned: "['3']"
  - operation: "time travel to first snapshot"
    status: "SUCCEEDED"
    duration_ms: 3194
    returned: "['3']"
  - operation: "OPTIMIZE (compaction)"
    status: "SUCCEEDED"
    duration_ms: 4748
  - operation: "VACUUM (expire snapshots)"
    status: "SUCCEEDED"
    duration_ms: 4773
  - operation: "concurrent INSERT #1"
    status: "SUCCEEDED"
    duration_ms: 4781
  - operation: "concurrent INSERT #2"
    status: "SUCCEEDED"
    duration_ms: 3199
  - operation: "count after concurrent inserts"
    status: "SUCCEEDED"
    duration_ms: 3198
    returned: "['4']"

summary: |
  Every operation succeeded. Athena created an Iceberg table whose data and
  metadata both live on the FSx for ONTAP S3 Access Point, then performed
  INSERT, UPDATE, DELETE, time travel, OPTIMIZE (compaction), VACUUM, and two
  concurrent commits without conflict.

why_this_works_where_others_fail: |
  Iceberg keeps the current-metadata pointer in the Glue Data Catalog, so a
  commit does not need a conditional write or an atomic rename on the object
  store. Delta Lake puts the commit in _delta_log on the object store itself,
  which is why it fails here. EMR Serverless fails for a different reason: its
  S3FileIO path does not handle the Access Point alias during metadata write.
  Athena's Iceberg implementation does not hit that code path.

not_established_by_this_run:
  - "Scale: the table held single-digit rows. Large-table compaction and
     manifest growth were not measured."
  - "Concurrency beyond two simultaneous commits."
  - "Iceberg via engines other than Athena (EMR Serverless Iceberg write is
     separately recorded as failing)."
  - "Position-delete vs copy-on-write behaviour was not inspected."

cleanup: |
  The probe table and its objects on the Access Point were removed after the run.

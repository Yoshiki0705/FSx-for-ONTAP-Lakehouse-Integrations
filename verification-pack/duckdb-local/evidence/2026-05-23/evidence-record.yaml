  - "Lambda deployment requires arm64 layer build via Docker"

# Notes
notes: |
  DuckDB 1.4.4 with httpfs successfully reads and writes to FSx for ONTAP S3 AP.
  5M row Parquet file scanned in under 1 second from local machine over internet.
  Write-back via COPY TO creates valid Parquet on FSx volume.
  No session policy issues (direct IAM credentials, no third-party platform intermediary).

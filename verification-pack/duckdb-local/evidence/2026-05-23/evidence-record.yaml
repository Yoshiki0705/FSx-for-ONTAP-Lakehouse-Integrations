# Verification Evidence Record — DuckDB Local
test_id: "DUCKDB-LOCAL-001"
date_tested: "2026-05-23"
tester: "repository maintainer"

# Infrastructure
region: "ap-northeast-1"
fsxn_deployment_type: "SINGLE_AZ_1"
fsxn_throughput_capacity_mbps: 128
ontap_version: "9.17.1"
svm_security_style: "UNIX"
volume_junction_path: "/vol1"

# Access Point Configuration
ap_name: "verification-test-ap"
ap_network_origin: "INTERNET"
ap_file_system_user_type: "UNIX"
ap_file_system_user_name: "root"
block_public_access: true

# DuckDB Configuration
duckdb_version: "1.4.4"
extension: "httpfs"
execution_mode: "local (macOS, in-process)"
s3_url_style: "path"

# Test Dataset
dataset_format: "Parquet"
files:
  - path: "bronze/transactions/sensor_data.parquet"
    rows: 10000
    columns: 7
  - path: "bronze/transactions/sensor_data_large.parquet"
    rows: 5000000
    columns: 7


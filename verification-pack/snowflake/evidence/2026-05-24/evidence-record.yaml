# Snowflake + FSx for ONTAP S3 AP Validation Evidence
test_id: "SNOWFLAKE-S3AP-002"
date_tested: "2026-05-24"
tester: "repository maintainer"

environment:
  snowflake_edition: "Standard"
  snowflake_region: "AWS_AP_NORTHEAST_1"
  snowflake_warehouse: "COMPUTE_WH (X-Small)"
  snowflake_role: "ACCOUNTADMIN"
  aws_region: "ap-northeast-1"
  fsx_file_system: "<FILE_SYSTEM_ID>"
  fsx_ontap_version: "9.17.1"
  svm: "<SVM_NAME>"
  s3_access_point_network_origin: "Internet"
  s3_ap_file_system_user: "UNIX (root)"

dataset:
  file_count: 33
  total_bytes: 217839059
  formats: ["parquet", "csv"]
  largest_file: "sensor_data_large.parquet (108 MB)"


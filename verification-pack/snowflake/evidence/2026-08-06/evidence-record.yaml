# ---------------------------------------------------------------------------
# UNV-006 — COPY INTO unload back to the Access Point
# ---------------------------------------------------------------------------
unv_006_unload_write_back:
  claim_before: |
    "Snowflake External Stages are read-only by design." That explanation is wrong.
  attempt_1_no_explicit_encryption:
    status: "FAILED_WITH_ERROR"
    duration_ms: 479
    error: |
      Remote upload failed checksum validation. Ensure the destination stage or
      COPY command was configured with the storage bucket's default encryption
      type, such as AWS_SSE_KMS.
    object_actually_written: true
    object_details:
      key: "sfverify/formats/unload_probe_1/data_0_0_0.csv.gz"
      size_bytes: 25
      gzip_integrity: "valid"
      content: "matches what was selected"
      server_side_encryption: "aws:fsx"
      storage_class: "FSX_ONTAP"
  attempt_2_encryption_aws_sse_s3:
    status: "HUNG"
    duration_ms: 173899
    outcome: "Cancelled after 2 m 54 s. Nothing was written."
  finding: |
    The write is not refused. It reaches the file system and the object is intact,
    but Snowflake fails the statement at checksum validation because FSx for ONTAP
    reports server-side encryption as aws:fsx, which is neither AWS_SSE_S3 nor
    AWS_SSE_KMS.

    The practical consequence is worse than a clean rejection: the statement
    reports failure while a complete object remains on the Access Point. Anyone who
    has attempted unload against an AP-backed stage should check for orphaned
    objects.

    Setting ENCRYPTION=(TYPE='AWS_SSE_S3') on the stage does not fix it; the
    statement stops failing fast and hangs instead.
  conclusion: |
    Unload to an AP-backed stage is not usable, and the reason recorded in this
    repository was wrong. Correct reason: encryption-type mismatch surfacing as a
    checksum validation failure, with a partial-write hazard.


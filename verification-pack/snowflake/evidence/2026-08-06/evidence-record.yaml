  method: |
    Created a standard S3 bucket and an IAM role, registered them as a Snowflake
    External Volume, then created a Managed Iceberg Table on it and loaded from
    the Access Point stage.
  external_volume:
    name: "EV_ICEBERG_VERIFY"
    base_url: "s3://<BUCKET>/iceberg/"
    verify_external_volume:
      success: true
      writeResult: "PASSED"
      readResult: "PASSED"
      listResult: "PASSED"
      deleteResult: "PASSED"
      awsRoleArnValidationResult: "PASSED"
  results:
    - operation: "CREATE EXTERNAL VOLUME"
      status: "PASS"
      duration_ms: 230
    - operation: "SYSTEM$VERIFY_EXTERNAL_VOLUME"
      status: "PASS"
      duration_ms: 2231
    - operation: "CREATE ICEBERG TABLE (CATALOG='SNOWFLAKE')"
      status: "PASS"
      duration_ms: 1644
    - operation: "COPY INTO iceberg table FROM AP-backed stage"
      status: "PASS"
      duration_ms: 2143
      rows_parsed: 3
      rows_loaded: 3
    - operation: "SELECT from iceberg table"
      status: "PASS"
      duration_ms: 1291
      rows_returned: 3
  files_written_to_external_volume:
    data_parquet: 1
    metadata_json: 2
    manifest_avro: 2
    note: "Real Iceberg layout, confirmed by listing the bucket."
  conclusion: |
    Verified end to end. The two-phase IAM trust setup an External Volume needs is
    the same pattern as a Storage Integration.

# ---------------------------------------------------------------------------
# UNV-002 — Dynamic Table over data from an AP-backed stage
# ---------------------------------------------------------------------------
unv_002_dynamic_table:
  claim_before: "Dynamic Table source confirmed (FULL refresh, min 60s TARGET_LAG) — a claim with no evidence, since withdrawn."
  constraint_found:
    attempt: "CREATE DYNAMIC TABLE selecting from an EXTERNAL TABLE over the AP stage"
    status: "REJECTED"
    error: "Object ref EXT_FMT_JSON of type EXTERNAL_TABLE not supported in Dynamic Table definition"
    meaning: |
      A Dynamic Table cannot read an Access Point through an external table. The
      stage has to be landed into a standard table first.
  working_path:
    - operation: "COPY INTO standard table FROM AP-backed stage"
      status: "PASS"
      duration_ms: 2114
      rows_loaded: 3
    - operation: "CREATE DYNAMIC TABLE (TARGET_LAG='60 seconds', REFRESH_MODE=FULL)"
      status: "PASS"
      duration_ms: 1872
    - operation: "SELECT from dynamic table"
      status: "PASS"
      duration_ms: 541
  refresh_behaviour:
    method: "Added a second file to the Access Point, loaded it, waited past the target lag."
    observed: |
      Aggregates updated correctly: one sensor went from 1 row avg 21.5 to 2 rows
      avg 25.75, and a new sensor appeared. Refresh history shows runs about every
      48 s, refresh_action FULL when data changed and NO_DATA when it had not, all
      SUCCEEDED, lag 1-3 s.
  conclusion: |
    Verified, with the constraint that the source must be a standard table.
    TARGET_LAG of 60 seconds and REFRESH_MODE FULL behave as specified.


# Verification Evidence Record — Snowflake against an FSx for ONTAP S3 Access Point
test_id: "SNOWFLAKE-S3AP-003"
date_tested: "2026-08-06"
tester: "repository maintainer"

purpose: |
  Close the Snowflake items in docs/en/unverified-inventory.md that only needed a
  session to run. Five were exercised. One of the five contradicted what this
  repository documented.

environment:
  snowflake_account: "<SNOWFLAKE_ACCOUNT>"
  snowflake_region: "AWS_AP_NORTHEAST_1"
  snowflake_version: "10.27.100"
  snowflake_role: "ACCOUNTADMIN"
  snowflake_warehouse: "COMPUTE_WH (X-Small)"
  database_schema: "FSXN_S3AP_VERIFY_DB.BRONZE"
  storage_integration: "FSXN_S3AP_VERIFY"
  aws_account: "<ACCOUNT_ID>"
  aws_region: "ap-northeast-1"
  s3_access_point: "snowflake-verification-ap"
  s3_ap_network_origin: "INTERNET"
  stage_parameter: "AWS_ACCESS_POINT_ARN set on every stage used"

# ---------------------------------------------------------------------------
# UNV-008 — read JSON, Avro and ORC from an AP-backed stage
# ---------------------------------------------------------------------------
unv_008_semi_structured_formats:
  claim_before: "Expected to work, same read path as Parquet/CSV. No run recorded."
  method: |
    One file per format written with identical content (3 rows, 4 columns) so the
    formats can be compared directly. Uploaded through the Access Point, then read
    with a named FILE FORMAT for each type.
  results:
    - format: "JSON"
      status: "PASS"
      rows_returned: 3
      duration_ms: 4120
    - format: "AVRO"
      status: "PASS"
      rows_returned: 3
      duration_ms: 3923
    - format: "ORC"
      status: "PASS"
      rows_returned: 3
      duration_ms: 1277
  note: |
    All three returned the same three rows with correct types, including the
    boolean. Inline FILE_FORMAT is not accepted in the stage table-function form;
    a named FILE FORMAT object is required. That is Snowflake syntax, not an
    Access Point limitation.
  conclusion: "Verified. JSON, Avro and ORC read the same as Parquet and CSV."


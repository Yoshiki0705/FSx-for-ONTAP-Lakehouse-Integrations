    snowflake_assume_role:
      list_objects_v2: "PASS"
      get_object: "FAIL — access denied"

root_cause: |
  Snowflake applies a session policy during AssumeRole that restricts
  s3:GetObject to standard S3 bucket ARN format (arn:aws:s3:::*/*).
  FSx for ONTAP S3 AP uses regional ARN format (arn:aws:s3:region:account:accesspoint/name/object/*).
  The session policy does not match the AP ARN for object-level operations.
  
  LIST succeeds because ListBucket uses bucket-level ARN (arn:aws:s3:::*)
  which matches the AP alias treated as a bucket name.

comparison_with_databricks: |
  Same root cause as Databricks Unity Catalog session policy issue.
  Difference: Snowflake allows LIST (bucket-level), Databricks blocks everything.
  Snowflake has NO workaround (SaaS, no Instance Profile bypass).
  Databricks has Instance Profile + boto3 workaround (bypasses UC governance).

support_cases:
  - platform: "Snowflake"
    case_id: "REDACTED"
    subject: "Storage Integration GetObject denied on FSx for ONTAP S3 AP"
    status: "Open"
  - platform: "AWS"
    case_id: "REDACTED"
    subject: "FSx for ONTAP S3 AP - Snowflake GetObject denied (session policy)"
    status: "Open — AWS confirmed denial is from Snowflake session policy"

workaround: "None available for Snowflake. Must wait for platform session policy update."

alternative_architectures:
  - "Athena for read-only SQL analytics (verified, zero-copy)"
  - "Glue ETL → S3 bucket → Snowflake External Stage (data copy)"
  - "SnapMirror → S3 → Snowflake (automated data copy)"

record_status: "SUPERSEDED"

superseded_by:
  date: "2026-05-24"
  record: "../2026-05-24/evidence-record.yaml"
  finding: |
    The AWS_ACCESS_POINT_ARN stage parameter resolves the session policy ARN
    mismatch recorded above. With it set on CREATE STAGE, SELECT, External Table,
    COPY INTO, Directory Table and governance tags all succeed.
  effect_on_this_record: |
    The failures recorded above are what was observed on 2026-05-23 without
    AWS_ACCESS_POINT_ARN, and are unchanged. The root_cause analysis remains an
    accurate description of the mechanism. The "workaround: None available" line
    is wrong and is retained only as history — a workaround does exist. Do not
    cite this record as evidence that Snowflake cannot read FSx for ONTAP S3
    Access Points.
  current_position: "../../../../integrations/snowflake/README.md"

# Architecture
architecture: |
  User/Role → Lake Formation (table/column permissions)
    → Glue Catalog (table metadata)
      → S3 Access Point (IAM + AP policy)
        → FSx for ONTAP (file system user permissions)
  
  Total authorization layers: 4
  1. Lake Formation: Who can access which tables/columns
  2. IAM: Who can call which APIs
  3. S3 AP Policy: Which principals can access this access point
  4. File System: UNIX permissions on the underlying files

# Governance Value
governance_value: |
  Lake Formation adds:
  - Table-level access control (without modifying S3 AP policy per table)
  - Column-level security (mask sensitive columns per role)
  - Tag-based access control (classify data, auto-grant by tag)
  - Centralized audit (who accessed what table, when)
  - Cross-account sharing (share tables without sharing S3 AP)
  
  This enables the "Best" configuration in the adoption assessment guide:
  - Healthcare: Column-level masking of PHI
  - Finance: Table-level segregation of duties per domain
  - Public sector: Tag-based classification enforcement

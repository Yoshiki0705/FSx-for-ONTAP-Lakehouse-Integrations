# Key Findings
key_findings:
  - "EMRFS (s3://) natively supports S3 AP aliases — no S3A configuration needed"
  - "Spark 3.5 does NOT support TIMESTAMP(NANOS,false) — use microsecond resolution"
  - "EMR Serverless cold start adds ~20s overhead (total 37s vs 16s Spark execution)"
  - "Read + GROUP BY + Window + Write + Read-back all succeed on FSx for ONTAP S3 AP"
  - "Write-back creates valid Parquet on FSx for ONTAP volume (verified by read-back)"
  - "No session policy issues (AWS-native service, direct IAM role)"

# Known Limitations
known_limitations:
  - "Parquet files must use microsecond (or INT96) timestamps, not nanosecond"
  - "EMR Serverless has ~20s cold start overhead per job"
  - "Internet-origin AP required (EMR Serverless runs outside customer VPC)"
  - "S3A FileSystem does NOT work with AP aliases (use EMRFS s3:// instead)"


# Verification Evidence Record — Redshift Spectrum
test_id: "REDSHIFT-SPECTRUM-001"
date_tested: "2026-05-23"
tester: "repository maintainer"

# Infrastructure
region: "ap-northeast-1"
fsxn_deployment_type: "SINGLE_AZ_1"
fsxn_throughput_capacity_mbps: 128
ontap_version: "9.17.1"

# Access Point Configuration
ap_name: "verification-test-ap"
ap_network_origin: "INTERNET"
ap_file_system_user_type: "UNIX"
ap_file_system_user_name: "root"

# Redshift Configuration
redshift_type: "Serverless"
redshift_rpu: 8
redshift_vpc: "vpc-0EXAMPLE7777aaaaa"
iam_role: "arn:aws:iam::<ACCOUNT_ID>:role/fsxn-redshift-spectrum-role"
external_schema: "fsxn_spectrum"
glue_database: "fsxn_athena_verification"

# Test Dataset
datasets:
  - table: "sensor_readings"
    format: "Parquet"
    rows: 10000
    columns: 7
    location: "s3://verification-tes-fpg5t76dgh3xchkrudk6yc4jhgzz1apn1b-ext-s3alias/sensor-data"
  - table: "sensor_benchmark"
    format: "Parquet"
    rows: 5000000
    columns: 7
    location: "s3://verification-tes-fpg5t76dgh3xchkrudk6yc4jhgzz1apn1b-ext-s3alias/benchmark"


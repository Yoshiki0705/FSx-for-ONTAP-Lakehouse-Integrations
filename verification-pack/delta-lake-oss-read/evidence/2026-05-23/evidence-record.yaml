# Delta Lake OSS Read-only Verification on FSx for ONTAP S3 Access Point
# Date: 2026-05-23
# Tool: delta-rs (deltalake Python package) v1.2.1

test_id: "DELTA-RS-READ-001"
date_tested: "2026-05-23"
tester: "repository maintainer"

# Infrastructure (same as Athena verification)
region: "ap-northeast-1"
fsxn_file_system_id: "fs-0EXAMPLE1111aaaaa"
fsxn_throughput_capacity_mbps: 128
svm_id: "svm-0EXAMPLE4444ddddd"
svm_name: "verification-svm"
volume_id: "fsvol-0EXAMPLE2345bcdef"
volume_name: "verification_vol"

# Access Point
ap_name: "verification-test-ap"
ap_alias: "verification-tes-fpg5t76dgh3xchkrudk6yc4jhgzz1apn1b-ext-s3alias"
ap_network_origin: "INTERNET"
ap_file_system_user: "root"

# Tool Configuration
tool: "delta-rs (deltalake Python package)"
tool_version: "1.2.1"
storage_options:
  AWS_REGION: "ap-northeast-1"
  AWS_S3_ALLOW_UNSAFE_RENAME: "true"

# Test Dataset
delta_table_path: "s3://verification-tes-.../delta-lake/sensor_table/"
created_by: "delta-rs:py-1.2.1 (local write, then uploaded via aws s3 sync)"
row_count: 10000
columns: ["id", "timestamp", "sensor_id", "temperature", "humidity", "status"]
data_file_size_bytes: 189167
delta_log_size_bytes: 1780
delta_version: 0

# Read Tests
read_tests:
  - test: "DeltaTable.open (metadata + log read)"
    result: "PASS"
    latency_seconds: 0.91
    details: "Version 0, schema correctly parsed, file list retrieved"

  - test: "to_pyarrow_table (full data read)"
    result: "PASS"
    latency_seconds: 1.38
    details: "10000 rows, 6 columns, 655553 bytes in memory"

  - test: "to_pandas + aggregation"
    result: "PASS"
    latency_seconds: 0.15
    details: "GROUP BY status: normal=8484, warning=1229, critical=287"

  - test: "metadata() + history()"
    result: "PASS"
    details: "Table ID, created_time, operation history all accessible"

# Write Test (Expected Failure)
write_tests:
  - test: "write_deltalake (new table creation)"
    result: "EXPECTED FAILURE"
    error_type: "OSError"
    error_message: "Generic S3 error: Error performing PUT .../delta-lake/write_test/_delta_log/00000000000000000000.json - Server returned non-2xx status code: 501 Not Implemented"
    details: |
      delta-rs 1.2.1 uses conditional writes (If-None-Match) by default when
      writing the initial commit file. FSx for ONTAP S3 AP returns 501 Not Implemented
      for conditional writes, which is consistent with the documented limitation.
      This confirms Delta Lake write operations are NOT SUPPORTED on FSx for ONTAP S3 AP.

# Summary
summary:
  read_operations: "ALL PASS - Delta Lake tables can be read from FSx for ONTAP S3 AP"
  write_operations: "NOT SUPPORTED - 501 Not Implemented (conditional writes)"
  recommendation: |
    Use FSx for ONTAP S3 AP for read-only Delta Lake access:
    1. Create/write Delta tables via NFS or native S3
    2. Read Delta tables from FSx for ONTAP S3 AP using delta-rs or Spark
    3. Do NOT attempt write/append/merge operations via S3 AP

# Verification Level
current_level: "Functional Verified (Read-only)"
notes: "Write operations confirmed Not Supported with clear error (501)"

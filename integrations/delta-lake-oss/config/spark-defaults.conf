# =============================================================================
# FSx for ONTAP Delta Lake OSS — Spark Configuration
# =============================================================================
# Spark defaults for Delta Lake on FSx for ONTAP via S3 Access Point.
# Deploy to EMR cluster or self-managed Spark.
#
# Usage (EMR):
#   Copy to /etc/spark/conf/spark-defaults.conf via bootstrap action
#
# Usage (self-managed):
#   spark-submit --properties-file spark-defaults.conf ...
# =============================================================================

# --- Delta Lake Extensions ---
spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog

# --- S3A FileSystem for S3 Access Point ---
spark.hadoop.fs.s3a.endpoint=s3.ap-northeast-1.amazonaws.com
spark.hadoop.fs.s3a.path.style.access=true
spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider=com.amazonaws.auth.InstanceProfileCredentialsProvider

# --- S3A Performance Tuning ---
spark.hadoop.fs.s3a.connection.maximum=200
spark.hadoop.fs.s3a.connection.timeout=300000
spark.hadoop.fs.s3a.socket.timeout=300000
spark.hadoop.fs.s3a.multipart.size=134217728
# multipart.threshold also decides which S3 call a rename becomes: at or below it the
# copy is a single CopyObject, above it S3A issues UploadPartCopy. UploadPartCopy within
# one FSx for ONTAP S3 Access Point currently returns NoSuchKey when the copy-source key
# needs percent-encoding. AWS classifies that as a defect with a fix in progress, so this
# is an interim consideration, not a permanent design constraint -- do not reshape key
# naming around it. Keeping output part files under this value (the >= 128 MB
# consolidation target already does) keeps renames on the CopyObject path.
# See docs/en/compatibility-matrix.md "Rename crosses two different S3 calls".
spark.hadoop.fs.s3a.multipart.threshold=268435456
spark.hadoop.fs.s3a.threads.max=64
spark.hadoop.fs.s3a.fast.upload=true
spark.hadoop.fs.s3a.fast.upload.buffer=bytebuffer

# --- Delta Lake Configuration ---
spark.delta.logStore.class=io.delta.storage.S3SingleDriverLogStore
spark.databricks.delta.properties.defaults.autoOptimize.optimizeWrite=true

# --- Spark Performance ---
spark.sql.adaptive.enabled=true
spark.sql.adaptive.coalescePartitions.enabled=true
spark.sql.files.maxPartitionBytes=268435456
spark.sql.parquet.compression.codec=zstd
spark.serializer=org.apache.spark.serializer.KryoSerializer

[project]
name = "opensharing-volumes-server"
version = "0.1.0"
description = "OpenSharing Volumes API reference server for S3-compatible backends"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    # starlette is a transitive dependency of fastapi. fastapi>=0.115.0 still allows
    # starlette<0.39.0, which has 7 published advisories. This floor excludes them.
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.30.0",
    "boto3>=1.35.0",
    "pyyaml>=6.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "httpx>=0.27.0",
    # 1.3.0 is the first release whose declared range admits pytest 9 (pytest<10).
    "pytest-asyncio>=1.3.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

version: '3.8'

services:
  trino:
    # Pinned to the version in verification-pack/trino/evidence/2026-05-26. A floating
    # tag lets the next release change the accepted catalog properties without notice.
    image: trinodb/trino:481
    container_name: trino
    ports:
      - "8080:8080"
    volumes:
      - ./config/etc:/etc/trino
    environment:
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - AWS_REGION=ap-northeast-1
    restart: unless-stopped

# S3 Tables through the AWS Glue Iceberg REST endpoint (Trino 484)
#
# Glue REST requires SigV4, and iceberg.rest-catalog.security defaults to NONE: without
# the two SIGV4 lines below the endpoint answers "Missing Authentication Token".
# On Trino 484 these two lines are enough. With no s3.iam-role and no static keys, 484 signs
# with the AWS default credentials provider chain, so temporary credentials (a session
# token, for example from IAM Identity Center) work. Measured on 2026-11-21 with SHOW SCHEMAS
# against the Glue Iceberg REST endpoint. Table reads and an S3 Tables warehouse were not
# tested; see verification-pack/trino/evidence/2026-11-21.
#
# Trino 481 behaves differently: with security=SIGV4 it refuses to start unless
# s3.aws-access-key and s3.aws-secret-key are set (NullPointerException:
# s3.aws-access-key is null), and neither property accepts a session token.
#
# Glue REST does not implement credential vending, so Trino uses its own credentials
# for both metadata and data access.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=https://glue.ap-northeast-1.amazonaws.com/iceberg
iceberg.rest-catalog.warehouse=catalogs/<ACCOUNT_ID>:s3tablescatalog/fsxn-metadata-catalog
iceberg.rest-catalog.vended-credentials-enabled=false
iceberg.rest-catalog.security=SIGV4
iceberg.rest-catalog.signing-name=glue
fs.s3.enabled=true
s3.region=ap-northeast-1

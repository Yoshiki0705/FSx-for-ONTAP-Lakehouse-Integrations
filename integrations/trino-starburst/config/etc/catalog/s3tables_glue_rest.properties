# S3 Tables through the AWS Glue Iceberg REST endpoint (Trino 481)
#
# Status: loads on Trino 481, but cannot read anything until requests are signed.
# Glue REST requires SigV4 and iceberg.rest-catalog.security defaults to NONE, so
# without the three SIGV4 lines below the endpoint answers "Missing Authentication
# Token". A control run on 481 with made-up credentials returned "The security token
# included in the request is invalid" once they were set, which shows the request was
# signed. A run with valid credentials has not been done.
#
# To enable signing, uncomment the SIGV4 block. 481 refuses to start when
# security=SIGV4 is set without s3.aws-access-key and s3.aws-secret-key
# (NullPointerException: s3.aws-access-key is null), and neither property accepts a
# session token. Use long-lived keys or s3.iam-role. The ${ENV:...} form below also
# makes the container fail to start when those variables are not set, which is why
# the block is not enabled by default.
#
# Glue REST does not implement credential vending, so Trino uses its own credentials
# for both metadata and data access.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=https://glue.ap-northeast-1.amazonaws.com/iceberg
iceberg.rest-catalog.warehouse=catalogs/<ACCOUNT_ID>:s3tablescatalog/fsxn-metadata-catalog
iceberg.rest-catalog.vended-credentials-enabled=false
fs.s3.enabled=true
s3.region=ap-northeast-1

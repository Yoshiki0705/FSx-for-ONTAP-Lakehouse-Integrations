# FSx for ONTAP S3 Access Point — Hive connector on Trino 481 (native S3, Glue metastore)
# Verified configuration: verification-pack/trino/evidence/2026-05-26/evidence-record.yaml
#
# Why not the earlier file-metastore + hive.s3.* configuration (Trino 438):
#   - hive.s3.* was removed from the Hive connector; Trino 481 and later refuse to start
#     with "Configuration property 'hive.s3.endpoint' was not used".
#   - hive.metastore=file fails on 481 with "No factory for location".
# AWS credentials come from the container environment (AWS_ACCESS_KEY_ID,
# AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN), as set in docker-compose.yaml.
connector.name=hive

hive.metastore=glue
hive.metastore.glue.region=ap-northeast-1

# Native S3 file system. Path-style access and an explicit endpoint are what make an
# S3 Access Point alias resolve.
fs.native-s3.enabled=true
s3.path-style-access=true
s3.endpoint=https://s3.ap-northeast-1.amazonaws.com
s3.region=ap-northeast-1

# FSx for ONTAP S3 Access Points through the Hive connector (Trino 481)
# Glue Data Catalog as the metastore, the native S3 file system for data access.
# Configuration verified by verification-pack/trino/evidence/2026-05-26/evidence-record.yaml
# (that run used the property name fs.native-s3.enabled, which 481 now reports as
# replaced by fs.s3.enabled).
#
# Credentials: the native S3 file system and the Glue client read the AWS default
# credential chain. docker-compose.yaml passes AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
# and AWS_SESSION_TOKEN through from the host, so temporary credentials work.
#
# Not used here, because Trino 481 removed them:
#   - hive.s3.* (legacy S3 file system; deprecated in 470, removed in 481)
#   - hive.metastore=file with a file: location needs fs.hadoop.enabled=true, which
#     the 481 release notes document as HDFS only.
connector.name=hive

hive.metastore=glue
hive.metastore.glue.region=ap-northeast-1

fs.s3.enabled=true
# Path-style access and an explicit endpoint are what make an S3 Access Point alias
# resolve.
s3.path-style-access=true
s3.endpoint=https://s3.ap-northeast-1.amazonaws.com
s3.region=ap-northeast-1
